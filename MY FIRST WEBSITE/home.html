<section>

    <h4>Log in</h4>
    <form>
        <label for="Username">Name:</label>
        <input type="text" id="Username" name="username" placeholder="Type your name here">

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Enter your e-mail here">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">

        <fieldset>
            <legend>Do you like Watching Anime? </legend>
            <label>
                <input type="radio" name="likeAnime" value="yes"> Yes
            </label>
            <label>
                <input type="radio" name="likeAnime" value="no"> No
            </label>
        </fieldset>

        <input type="submit" value="Submit">
    </form>
